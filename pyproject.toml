[project]
name = "semver"
version = "0.1.0"
description = "Parse, compare and sort semantic versions including prereleases."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
